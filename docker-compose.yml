services:

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: backend_journey_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: girish123

    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000

    ports:
      - "8000:8000"

    depends_on:
      - db

volumes:
  postgres_data: